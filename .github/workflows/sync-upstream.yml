name: Sync fork with upstream

# ============================================================================
# Sincronizacion fork - upstream mediante Pull Request
# ----------------------------------------------------------------------------
# Fork:     CortesMacias/claude-para-abogados
# Upstream: betobetico/claude-para-abogados
#
# Estrategia: en lugar de un merge --ff-only (que se rompe cuando el fork
# tiene commits propios sobre main), este workflow abre un Pull Request con
# las novedades del upstream. Ventajas:
#   - El workflow vive en main (rama por defecto), por lo que el cron se ejecuta.
#   - Nunca fuerza ni reescribe main; los commits propios se conservan.
#   - Los cambios entrantes se revisan y fusionan de forma trazable.
#   - Si hay conflictos, se resuelven en el PR y no rompen el automatismo.
# ============================================================================

on:
  schedule:
    # Cada lunes a las 06:00 UTC (08:00 CEST verano / 07:00 CET invierno).
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar identidad Git del bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Anadir remoto upstream y fetch
        run: |
          git remote add upstream https://github.com/betobetico/claude-para-abogados.git
          git fetch upstream

      - name: Comprobar novedades del upstream
        id: check
        run: |
          COMMITS_AHEAD=$(git rev-list origin/main..upstream/main --count)
          echo "Commits nuevos en upstream no presentes en el fork: $COMMITS_AHEAD"
          if [ "$COMMITS_AHEAD" -gt 0 ]; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            echo "El upstream tiene $COMMITS_AHEAD commits nuevos. Se preparara un PR."
          else
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            echo "El fork ya esta al dia con el upstream. Sin accion."
          fi

      - name: Actualizar rama de sincronizacion
        if: steps.check.outputs.needs_update == 'true'
        run: |
          git branch -f upstream-sync upstream/main
          git push --force origin upstream-sync

      - name: Abrir o actualizar Pull Request
        if: steps.check.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ABIERTOS=$(gh pr list --head upstream-sync --base main --state open --json number --jq 'length')
          if [ "$ABIERTOS" -gt 0 ]; then
            echo "Ya existe un PR abierto para upstream-sync; el push lo actualiza."
          else
            gh pr create \
              --base main \
              --head upstream-sync \
              --title "Sync: novedades de betobetico/claude-para-abogados" \
              --body "PR automatico generado por .github/workflows/sync-upstream.yml. Incorpora los commits nuevos del upstream. Revisa los cambios, resuelve conflictos si los hubiera y fusiona. Tus commits propios (workflow y marketplace.json) se conservan."
          fi
